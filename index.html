<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="./images/logo.png">
    <link rel="stylesheet" href="styles.css">

    <title>Shahmar Gadirov's Portfolio</title>
</head>

<body>

    <header>
        <div class="logo">SHAHMAR.GADIROV</div>
        <nav class="header-links" aria-label="Social links">
            <a class="status-badge status-badge--github" href="https://github.com/shahmargadirov" target="_blank"
                rel="noopener noreferrer">My GitHub</a>
            <a class="status-badge status-badge--linkedin" href="https://linkedin.com/in/shahmar-gadirov"
                target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Welcome to my Portfolio!</h1>
            <p>Here you can find some of my projects.</p>
        </section>


        <section class="grid">

            <!-- Project 1 -->
            <div class="card" onclick="openProject('pioguide')">

                <div class="card-placeholder">
                    <img src="./images/projects/pioguide/thumbnail1.png" alt="PioGuide">

                    <img class="card-logo" src="./images/projects/pioguide/logo.png" alt="">
                </div>

                <div class="card-content">
                    <h3>PioGuide</h3>
                    <p>
                        iOS Campus Navigation & AI Academic Advising Application.
                    </p>
                </div>

            </div>


            <!-- Project 2 -->
            <div class="card" onclick="openProject('motorsport')">

                <div class="card-placeholder">
                    <img class="card-thumbnail" src="./images/projects/motorsport/thumbnail1.png" alt="MOTORSPORT">

                    <img class="card-logo" src="./images/projects/motorsport/logo.png" alt="">
                </div>
                <div class="card-content">
                    <h3>MOTORSPORT</h3>
                    <p> Sim-Cade Racing, Vehicle Simulation + Detail goodness. </p>
                </div>
            </div>
        </section>
    </main>


    <div id="project-modal" class="modal">
        <div class="modal-content">
            <button class="close-button" onclick="closeProject()">
                &times;
            </button>
            <!-- Horizontal image gallery -->
            <div id="project-gallery" class="project-gallery">
                <!-- Images are generated by JavaScript -->
            </div>
            <!-- Project information -->
            <div class="project-info">
                <h2 id="project-title"></h2>

                <p id="project-description"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>

</body>

</html>
