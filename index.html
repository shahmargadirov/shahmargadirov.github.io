<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./images/logo.png">
    <link rel="stylesheet" href="styles.css">
    <title>Shahmar Gadirov's Portfolio</title>
</head>

<body>
    <header>
        <div class="logo">SHAHMAR.GADIROV</div>
        <nav class="header-links" aria-label="Social links">
            <a class="status-badge status-badge--github" href="https://github.com/shahmargadirov" target="_blank"
                rel="noopener noreferrer">My GitHub</a>
            <a class="status-badge status-badge--linkedin" href="https://linkedin.com/in/shahmar-gadirov"
                target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Welcome to my Portfolio!</h1>
            <p>Here you can find some of my projects.</p>
            
        </section>
        <section class="grid" aria-label="Projects">
            <button class="card" type="button" onclick="openProject('pioguide')">
                <div class="card-placeholder">
                    <img class="card-thumbnail" src="./images/projects/pioguide/thumbnail1.png"
                        alt="PioGuide app preview">
                    <img class="card-logo" src="./images/projects/pioguide/logo.png" alt="">
                </div>
                <div class="card-content">
                    <h3>PioGuide</h3>
                    <p>iOS Campus Navigation &amp; AI Academic Advising Application.</p>
                </div>
            </button>
            <button class="card" type="button" onclick="openProject('motorsport')">
                <div class="card-placeholder">
                    <img class="card-thumbnail" src="./images/projects/motorsport/thumbnail1.png"
                        alt="MOTORSPORT game preview">
                    <img class="card-logo" src="./images/projects/motorsport/logo.png" alt="">
                </div>
                <div class="card-content">
                    <h3>MOTORSPORT</h3>
                    <p>Sim-cade racing, vehicle simulation, and detailed environments.</p>
                </div>
            </button>
        </section>
    </main>
    
    <div id="project-modal" class="modal" aria-hidden="true">
        <section class="modal-content" role="dialog" aria-modal="true" aria-label="Project details">
            <button class="close-button" type="button" onclick="closeProject()"
                aria-label="Close project">&times;</button>
            <iframe id="project-frame" src="about:blank" title="Project details" loading="eager"></iframe>
        </section>
    </div>
    <script src="script.js"></script>
</body>

</html>
